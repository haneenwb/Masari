<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساري — مسارك، خطوتك القادمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#f6f9fc; --card:#ffffff; --card-2:#f6f9fc;
  --brand:#533afd; --brand-2:#665efd; --brand-deep:#4434d4; --brand-press:#2e2b8c;
  --brand-tint:#f0efff; --brand-pill:#b9b9f9; --brand-ink:#0d253d; --nav:#0d253d;
  --accent:#665efd; --accent-2:#f5e9d4; --ruby:#ea2261; --magenta:#f96bee;
  --gold:#9b6829; --gold-tint:#f5e9d4;
  --text:#0d253d; --muted:#64748d; --line:#e3e8ee; --line-2:#eef2f6;
  --ok:#0e6245; --warn:#9b6829; --bad:#ea2261;
  --r-s:6px; --r-m:8px; --r-l:12px; --r-xl:16px;
  --sh:0 1px 3px rgba(0,55,112,.08);
  --sh-2:0 8px 24px rgba(0,55,112,.12), 0 2px 6px rgba(0,55,112,.06);
  --f-ar:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-en:"Inter",system-ui,sans-serif;
  --t:160ms cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1324; --card:#131d33; --card-2:#1c2844; --brand:#7b73ff; --brand-2:#9b93ff;
  --brand-deep:#665efd; --brand-press:#533afd; --brand-tint:#1e2548; --brand-pill:#2a3360;
  --brand-ink:#e8edfc; --nav:#080e1c; --accent:#7b73ff; --accent-2:#352f20;
  --ruby:#f45887; --magenta:#fa8df2; --gold:#d4a04d; --gold-tint:#332918;
  --text:#f1f5fd; --muted:#8898aa; --line:#243352; --line-2:#1b263e;
  --ok:#4ade80; --warn:#d4a04d; --bad:#f45887;
  --sh:0 1px 3px rgba(0,0,0,.45); --sh-2:0 8px 24px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0b1324; --card:#131d33; --card-2:#1c2844; --brand:#7b73ff; --brand-2:#9b93ff;
  --brand-deep:#665efd; --brand-press:#533afd; --brand-tint:#1e2548; --brand-pill:#2a3360;
  --brand-ink:#e8edfc; --nav:#080e1c; --accent:#7b73ff; --accent-2:#352f20;
  --ruby:#f45887; --magenta:#fa8df2; --gold:#d4a04d; --gold-tint:#332918;
  --text:#f1f5fd; --muted:#8898aa; --line:#243352; --line-2:#1b263e;
  --ok:#4ade80; --warn:#d4a04d; --bad:#f45887;
  --sh:0 1px 3px rgba(0,0,0,.45); --sh-2:0 8px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--text); font-family:var(--f-ar); font-size:15px; font-weight:400; line-height:1.8;
  -webkit-font-smoothing:antialiased; font-feature-settings:"ss01"}
html[lang="en"] body{font-family:var(--f-en); line-height:1.6}
h1,h2,h3,h4{margin:0 0 .35em; color:var(--text); font-weight:300; line-height:1.2}
h1{font-size:32px; line-height:1.15}
h2{font-size:22px; line-height:1.25}
h3{font-size:18px; line-height:1.4}
html[lang="en"] h1{letter-spacing:-.64px}
html[lang="en"] h2{letter-spacing:-.22px}
html[lang="en"] h3{letter-spacing:-.1px}
html[lang="en"] body{font-weight:300}
.num,.tnum,.pill,.cvsheet,.bar-head b,.lab b{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
h4{font-size:14px; color:var(--muted); font-weight:500}
p{margin:0 0 .9em; max-width:72ch}
.cap,small{font-size:13px; color:var(--muted); line-height:1.65}
a{color:var(--brand-2)}
button,input,select,textarea{font-family:inherit; font-size:15px; color:var(--text)}
:focus-visible{outline:2.5px solid var(--brand-2); outline-offset:2px; border-radius:6px}

/* ---------------- shell ---------------- */
.shell{display:flex; flex-direction:column; min-height:100dvh; position:relative}
.side{display:none; position:fixed; top:0; bottom:0; width:280px; max-width:85vw; background:var(--nav); padding:16px 14px; z-index:70; overflow-y:auto}
html[dir="ltr"] .side{right:0; left:auto; border-left:1px solid rgba(255,255,255,.1); box-shadow:-6px 0 28px rgba(0,0,0,.35)}
html[dir="ltr"] .side.open{display:block; animation:sideInLtr .2s ease both}
@keyframes sideInLtr{from{opacity:0; transform:translateX(20px)}to{opacity:1; transform:none}}

html[dir="rtl"] .side{left:0; right:auto; border-right:1px solid rgba(255,255,255,.1); box-shadow:6px 0 28px rgba(0,0,0,.35)}
html[dir="rtl"] .side.open{display:block; animation:sideInRtl .2s ease both}
@keyframes sideInRtl{from{opacity:0; transform:translateX(-20px)}to{opacity:1; transform:none}}

.side-veil{position:fixed; inset:0; z-index:65; background:rgba(8,24,40,.45); animation:fade .2s ease both}
.side-hd{display:flex; align-items:center; justify-content:space-between; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:8px}
.btn-side-close{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; background:rgba(255,255,255,.08); border:0; border-radius:var(--r-s); color:#a8b8cc; cursor:pointer; font-size:13px; transition:all var(--t)}
.btn-side-close:hover{background:rgba(255,255,255,.18); color:#fff}
.side .logo svg{--brand-ink:#ffffff; --gold:#f5e9d4}
.side .logo b{color:#fff}
.logo{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
.logo svg{width:38px; height:36px; flex:none}
.brand-big{width:96px; height:92px; display:block; margin-bottom:10px}
.logo b{font-size:18px; letter-spacing:.01em; display:block}
.side nav{display:grid; gap:2px}
.side nav h4{padding:16px 10px 4px; margin:0; font-size:10px; font-weight:400; letter-spacing:.1px; text-transform:uppercase; color:#7888a2}
.side nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:start; background:none; border:0;
  padding:9px 11px; border-radius:var(--r-m); color:#a8b8cc; cursor:pointer; transition:background var(--t), color var(--t)}
.side nav button svg{width:19px; height:19px; flex:none}
.side nav button:hover{background:rgba(255,255,255,.08); color:#fff}
.side nav button[aria-current="page"]{background:var(--brand); color:#fff; font-weight:500; box-shadow:0 2px 8px rgba(83,58,253,.35)}
.main{min-width:0; display:flex; flex-direction:column; flex:1; width:100%}
.topbar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); padding:12px 22px; display:flex; align-items:center; gap:10px}
:root[data-theme="dark"] .topbar{background:rgba(11,19,36,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar{background:rgba(11,19,36,.88)}}
.btn-back{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0;
  background:none; border:1px solid transparent; border-radius:var(--r-s); color:var(--muted); cursor:pointer; flex:none; transition:all var(--t)}
.btn-back:hover{color:var(--text); background:var(--card-2); border-color:var(--line-2)}
.btn-back:active{transform:scale(.95)}
.btn-back svg{width:18px; height:18px}
.btn-more{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; padding:0;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); color:var(--text); cursor:pointer; flex:none; transition:all var(--t)}
.btn-more:hover{background:var(--card-2); border-color:var(--brand)}
.btn-more.open{background:var(--brand); color:#fff; border-color:var(--brand)}
.btn-more svg{width:18px; height:18px}
.topbar .t-title{font-weight:500; margin-inline-end:auto; font-size:16px; display:flex; align-items:center; gap:10px}
.topbar .t-title b{font-size:18px; font-weight:700; letter-spacing:.01em; color:var(--text); line-height:1}
.topbar-logo{width:36px; height:34px; display:block; flex:none}
.page{padding:22px; max-width:1180px; width:100%; margin-inline:auto}
@media(max-width:900px){
  .page{padding:16px 14px 84px}
  .topbar{padding:10px 14px}
  h1{font-size:23px}
}

/* ---------------- primitives ---------------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:20px; box-shadow:var(--sh)}
.card.pad-lg{padding:24px}
.card.tint{background:var(--accent-2); border:1px solid rgba(155,104,41,.18)}
:root[data-theme="dark"] .card.tint{background:#252016; border-color:rgba(212,160,77,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card.tint{background:#252016; border-color:rgba(212,160,77,.25)}}
.card.hov{transition:transform var(--t), box-shadow var(--t), border-color var(--t)}
.card.hov:hover{transform:translateY(-2px); box-shadow:var(--sh-2); border-color:rgba(83,58,253,.3)}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.split{display:grid; gap:16px; grid-template-columns:1fr}
@media(min-width:1000px){.split{grid-template-columns:1fr 1fr}.split.wide{grid-template-columns:1.15fr .85fr}}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spread{justify-content:space-between}
.stack{display:grid; gap:16px}
.rule{height:1px; background:var(--line-2); margin:14px 0}
.btn{background:var(--brand); color:#fff; border:1px solid transparent; padding:9px 17px; border-radius:9999px; cursor:pointer;
  font-weight:400; font-size:15px; transition:background var(--t), transform var(--t)}
:root[data-theme="dark"] .btn:not(.sec){color:#2a1608}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec){color:#2a1608}}
.btn:hover{background:var(--brand-deep)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card); color:var(--brand); border-color:var(--brand)}
.btn.sec:hover{background:var(--brand-tint)}
.btn.gold{background:var(--nav); color:#fff}
.btn.sm{padding:8px 16px; font-size:14px}
.btn.block{width:100%; justify-content:center}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:4px 10px; border-radius:9999px;
  background:var(--card-2); color:var(--muted); border:1px solid var(--line-2)}
.pill.brand{background:var(--brand-pill); color:var(--brand-deep); border-color:transparent}
.pill.gold{background:var(--gold-tint); color:var(--warn); border-color:transparent}
.pill.ok{background:transparent; color:var(--ok); border-color:var(--ok)}
.pill.warn{background:transparent; color:var(--warn); border-color:var(--warn)}
.stat{display:grid; gap:2px}
.stat .num{font-size:26px; font-weight:300; letter-spacing:-.26px; line-height:1.2}
.icon{width:18px; height:18px; vertical-align:-3.5px}
.i-lg{width:22px; height:22px}
.dir-icon{transform:scaleX(1)}
html[dir="ltr"] .dir-icon{transform:scaleX(-1)}
.note{background:var(--card-2); border-inline-start:3px solid var(--gold); border-radius:var(--r-s); padding:11px 13px; font-size:14px}
.note p:last-child{margin:0}

/* bars */
.bar{height:8px; border-radius:999px; background:var(--line-2); overflow:hidden}
.bar>span{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar.thin{height:6px}
.bar>span[data-tone="warn"]{background:var(--gold)}
.bar>span[data-tone="low"]{background:var(--bad)}
.barline{display:grid; gap:6px; margin-bottom:12px}
.barline .lab{display:flex; justify-content:space-between; gap:10px; font-size:14px}

/* ring */
.ring{position:relative; width:132px; height:132px; flex:none}
.ring svg{transform:rotate(-90deg)}
html[dir="rtl"] .ring svg{transform:rotate(-90deg) scaleY(-1)}
.ring .val{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.ring .val b{font-size:27px; font-weight:600; display:block; line-height:1.1}
.ring .val small{font-size:11.5px}

/* form */
label.fl{display:block; font-size:13.5px; color:var(--muted); margin:14px 0 5px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%; padding:9px 12px; border:1px solid #d9d2c6; border-radius:var(--r-s); background:var(--card);
  transition:border-color var(--t), box-shadow var(--t)}
input:focus,select:focus,textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); outline:none}
textarea{min-height:110px; line-height:1.7}
.check{display:flex; gap:10px; align-items:center; padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-m); cursor:pointer; transition:background var(--t)}
.check:hover{background:var(--card-2)}
.err{color:var(--bad); font-size:13.5px; min-height:20px}
.chip{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 13px; cursor:pointer; font-size:14px; transition:all var(--t)}
.chip[data-on="1"]{background:var(--brand); color:#fff; border-color:var(--brand)}
.skill-chip{display:grid; gap:5px; min-width:150px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r-m);
  background:var(--card); cursor:pointer; text-align:start; transition:border-color var(--t), transform var(--t)}
.skill-chip:hover{border-color:var(--brand-2)}
.skill-chip:active{transform:scale(.98)}
.skill-chip .t{display:flex; justify-content:space-between; gap:8px; font-size:13.5px}

/* steps / timeline */
.stepper{display:flex; gap:6px; align-items:center; margin-bottom:6px}
.stepper i{height:5px; flex:1; border-radius:999px; background:var(--line-2); transition:background var(--t)}
.stepper i[data-on="1"]{background:var(--brand)}
.phase{display:grid; grid-template-columns:auto 1fr; gap:14px}
.phase-rail{display:grid; justify-items:center}
.phase-rail .n{width:34px; height:34px; border-radius:50%; display:grid; place-content:center; font-size:13px; font-weight:600;
  background:var(--card-2); color:var(--muted); border:1px solid var(--line)}
.phase-rail .n[data-done="1"]{background:var(--brand); color:#fff; border-color:transparent}
.phase-rail .line{width:2px; flex:1; background:var(--line); min-height:18px; margin-block:4px}
.task{display:flex; gap:12px; align-items:flex-start; padding:11px 12px; border:1px solid var(--line); border-radius:var(--r-m);
  background:var(--card); transition:background var(--t), border-color var(--t)}
.task:hover{border-color:var(--brand-2)}
.box{width:20px; height:20px; flex:none; margin-top:3px; border-radius:6px; border:1.8px solid var(--line); background:var(--card);
  display:grid; place-content:center; cursor:pointer; transition:all var(--t)}
.box[data-s="in_progress"]{border-color:var(--gold); background:var(--gold-tint)}
.box[data-s="done"]{border-color:var(--brand); background:var(--brand)}
.box svg{width:13px; height:13px; color:#fff; opacity:0; transition:opacity var(--t)}
.box[data-s="done"] svg{opacity:1; color:var(--card)}
.task[data-done="1"] .tt{color:var(--muted); text-decoration:line-through}

/* ai card */
.ai{background:#1c1e54; color:#f1f5fd; border:1px solid rgba(83,58,253,.32); border-radius:var(--r-l); padding:22px; box-shadow:0 8px 24px rgba(13,37,61,.14)}
:root[data-theme="dark"] .ai{background:#131d33; border-color:rgba(123,115,255,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ai{background:#131d33; border-color:rgba(123,115,255,.3)}}
.ai .hd{display:flex; align-items:center; gap:8px; color:#ffffff; font-weight:600}
.ai .cap{color:#94a3b8}
.ai .pipe .p{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14); color:#cbd5e1}
.ai .pipe .p:last-child{background:rgba(83,58,253,.4); border-color:var(--brand); color:#ffffff}
.ai .pipe .ch{color:#64748d}
.reveal{animation:fade .4s ease both}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* empty / skeleton */
.empty{text-align:center; padding:28px 16px}
.empty .art{width:150px; max-width:55%; margin:0 auto 8px; display:block}
.skel{height:12px; border-radius:6px; background:linear-gradient(90deg,var(--line-2),var(--card-2),var(--line-2)); background-size:200% 100%; animation:sh 1.3s linear infinite; margin:9px 0}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* cv */
.cvsheet{background:#fff; color:#10130f; border:1px solid var(--line); border-radius:var(--r-m); padding:26px; line-height:1.75; font-size:14.5px}
.cvsheet h2,.cvsheet h3{color:#10130f}
.cvsheet h3{font-size:14px; margin:16px 0 4px; border-bottom:1px solid #d9ded7; padding-bottom:3px}
@media print{ .side,.topbar,.tabbar,.side-veil,.no-print,footer{display:none !important} .page{padding:0; max-width:none} .cvsheet{border:0; padding:0} body{background:#fff} }

/* mobile nav */
.tabbar{display:none}
@media(max-width:900px){
  .tabbar{display:flex; position:fixed; inset-inline:0; bottom:0; z-index:60; background:rgba(255,255,255,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--line)}
  :root[data-theme="dark"] .tabbar{background:rgba(19,29,51,.94)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar{background:rgba(19,29,51,.94)}}
  .tabbar button{flex:1; display:grid; justify-items:center; gap:3px; background:none; border:0; padding:8px 2px 10px;
    color:var(--muted); font-size:10.5px; cursor:pointer}
  .tabbar svg{width:21px; height:21px}
  .tabbar button[aria-current="page"]{color:var(--brand); font-weight:500}
  .tabbar button[aria-current="page"] svg{color:var(--brand)}
  .tabbar button.tab-more{display:flex; align-items:center; justify-content:center}
  .tabbar button.active{color:var(--brand); font-weight:500}
  .tabbar button.active svg{color:var(--brand)}
}
.veil{position:fixed; inset:0; background:rgba(8,24,40,.52); display:grid; place-items:center; padding:14px; z-index:50}
.modal{background:var(--card); border-radius:var(--r-xl); max-width:540px; width:100%; padding:22px; box-shadow:var(--sh-2)}
.sheet{background:var(--card); border-radius:var(--r-xl) var(--r-xl) 0 0; width:100%; max-width:560px; padding:16px; align-self:end; margin-bottom:54px; max-height:calc(85dvh - 54px); overflow-y:auto}
.sheet button{display:flex; gap:10px; align-items:center; width:100%; text-align:start; padding:13px 10px; background:none;
  border:0; border-bottom:1px solid var(--line-2); cursor:pointer; font-size:15.5px}
.toast{position:fixed; inset-inline:0; bottom:92px; margin-inline:auto; width:max-content; max-width:88%; background:var(--brand);
  color:#fff; padding:11px 18px; border-radius:999px; z-index:60; font-size:14.5px; box-shadow:var(--sh-2)}
.scroll-x{overflow-x:auto}
.mesh-host{position:relative; overflow:hidden}
.hero-stats{display:flex; flex-wrap:wrap; gap:26px; margin-top:18px}
.hero-stats b{display:block; font-size:26px; font-weight:300; letter-spacing:-.26px; line-height:1.1}
.hero-stats span{font-size:13px; color:var(--muted)}
.path-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:20px;
  box-shadow:var(--sh); transition:transform var(--t), box-shadow var(--t), border-color var(--t)}
.path-card:hover{transform:translateY(-2px); box-shadow:var(--sh-2); border-color:rgba(83,58,253,.35)}
.path-card .track{display:block; margin-bottom:12px}
.orgs{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px}
.org-tile{border:1px solid var(--line); border-radius:var(--r-m); background:var(--card); padding:14px 10px;
  text-align:center; font-size:13.5px; color:var(--muted); line-height:1.5; transition:color var(--t), border-color var(--t), box-shadow var(--t)}
.org-tile:hover{color:var(--text); border-color:rgba(83,58,253,.35); box-shadow:var(--sh)}
.mesh{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
.mesh-host > *:not(.mesh){position:relative; z-index:1}
:root[data-theme="dark"] .mesh{opacity:.42}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mesh{opacity:.42}}
html[dir="rtl"] .flip-dir{transform:scaleX(-1)}
.art-side{max-width:168px; flex:none}
img.art{border-radius:var(--r-l); object-fit:cover; aspect-ratio:16/10; background:var(--card-2)}
img.art-side{aspect-ratio:4/3}
@media(max-width:760px){.art-side{display:none}}
.journey{display:flex; align-items:flex-start; overflow-x:auto; padding:4px 0; scrollbar-width:none}
.journey::-webkit-scrollbar{display:none}
.jstage{display:grid; justify-items:center; gap:6px; text-align:center; min-width:78px; flex:0 0 auto}
.jstage .bub{width:44px; height:44px; border-radius:14px; display:grid; place-content:center; background:var(--card-2);
  color:var(--muted); border:1px solid var(--line); transition:all var(--t)}
.jstage .bub svg{width:21px; height:21px}
.jstage[data-s="done"] .bub{background:var(--brand); color:var(--card); border-color:transparent}
.jstage[data-s="now"] .bub{background:var(--brand-tint); color:var(--brand-ink); border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-tint)}
.jstage span{font-size:12px; color:var(--muted)}
.jstage[data-s="now"] span,.jstage[data-s="done"] span{color:var(--text)}
.jline{flex:1 1 14px; min-width:14px; height:2px; margin-top:21px; background:var(--line); border-radius:2px}
.jline[data-on="1"]{background:var(--brand)}
.pipe{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:12px}
.pipe .p{display:flex; gap:6px; align-items:center; background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:5px 9px; font-size:12.5px; color:var(--muted)}
.pipe .p svg{width:14px; height:14px}
.pipe .p:last-child{border-color:var(--brand); color:var(--brand-ink); background:var(--brand-tint)}
.pipe .ch{width:13px; height:13px; color:var(--muted); flex:none}
.bridge{display:grid; gap:8px}
.bridge svg{width:100%; height:auto; max-height:132px}

/* auth gate */
.auth-shell{display:flex; min-height:100vh; width:100%; background:var(--bg)}
.auth-panel{flex:0 0 460px; width:460px; max-width:100%; display:flex; flex-direction:column; justify-content:space-between;
  padding:36px 36px; background:var(--card); border-inline-end:1px solid var(--line); box-shadow:var(--sh-2); z-index:2; overflow-y:auto}
.auth-visual{flex:1 1 0%; min-width:0; background-image:url('assets/photo_2026-09-08_00-52-45.jpg');
  background-size:cover; background-position:center center; background-repeat:no-repeat; position:relative}
:root[data-theme="dark"] .auth-visual::after{content:""; position:absolute; inset:0; background:rgba(11,19,36,.38); pointer-events:none}
.auth-hd{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px}
.auth-body{flex:1; display:flex; flex-direction:column; justify-content:center}
.auth-title{margin:0 0 6px; font-size:24px; font-weight:600}
.auth-sub{margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.5}
.auth-tabs{display:flex; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-m); padding:3px; gap:4px; margin:4px 0 16px}
.auth-tab{flex:1; border:0; background:transparent; padding:8px 12px; border-radius:var(--r-s); font-size:13.5px; font-weight:500; color:var(--muted); cursor:pointer; transition:all var(--t)}
.auth-tab.active{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-form{display:grid}
.auth-switch{margin-top:16px; text-align:center; font-size:13.5px; color:var(--muted)}
.link-btn{background:none; border:0; color:var(--brand-2); font-size:13.5px; font-weight:500; cursor:pointer; text-decoration:underline; padding:0 4px}
.link-btn:hover{color:var(--brand-deep)}
.auth-foot{margin-top:28px; padding-top:16px; border-top:1px solid var(--line-2)}
.pill-badge{display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); background:var(--card-2); border:1px solid var(--line); border-radius:9999px; padding:6px 12px; line-height:1.4}
.pill-badge svg{width:14px; height:14px; flex:none; color:var(--ok)}
@media (max-width:900px){
  .auth-shell{flex-direction:column; min-height:100vh}
  .auth-visual{flex:none; height:180px; width:100%; order:-1}
  .auth-panel{flex:1; width:100%; max-width:100%; padding:24px 20px 32px; border-inline-end:none}
  .auth-hd{margin-bottom:18px}
  .auth-title{font-size:22px}
}

  authed:false, consent:false, locale:"ar", theme:"light", step:0, completed:false, route:"home",
  profile:{name:"",uni:"",field:"",major:"",year:"",gpa:"",gpaScale:"5",gpaSkip:false,exp:"none",coop:false,courses:"0",

let state = load(), analyzing = 0, sheetOpen=false, moreOpen=false, pendingConsent=null, routeHistory=[], authMode="login";
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    const authedSession = (function(){
      try{ return sessionStorage.getItem("masari.authed") === "true"; }catch(e){ return false; }
    })();
    if(!raw) {
      const s = migrate();
      if(authedSession) s.authed = true;
      return s;
    }
    const p = JSON.parse(raw);
    const s = Object.assign(structuredClone(BLANK), p, {profile:Object.assign(structuredClone(BLANK.profile), p.profile||{})});
    if(authedSession || p.authed === true) s.authed = true;
    return s;
  }catch(e){ return structuredClone(BLANK); }
}
function migrate(){ /* carry over data saved by the previous version */
  const s = structuredClone(BLANK);
  try{
    const old = JSON.parse(localStorage.getItem("masar.v1")||"null"); if(!old) return s;
    Object.assign(s, {consent:old.consent, locale:old.locale||"ar", theme:old.theme||"light",
      completed:!!old.completed, projects:old.projects||[], picks:old.picks||s.picks});
    Object.assign(s.profile, old.profile||{});
    const sk={}; Object.entries(s.profile.skills||{}).forEach(([k,v])=> sk[k] = v>=2?100:v===1?50:0);
    s.profile.skills = sk;
  }catch(e){}
  return s;
}
function save(){ if(!state.consent) return; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function wipe(){ try{ localStorage.removeItem(KEY); localStorage.removeItem("masar.v1"); }catch(e){} state = structuredClone(BLANK); }

const PHOTOS = {};   // hero:{src:"img/hero-1024.webp", srcset:"img/hero-640.webp 640w, img/hero-1024.webp 1024w", w:1024, h:640}
function photoSlot(key, alt, fallbackId, cls="art", eager){
  const ph = PHOTOS[key];
  if(!ph) return art(fallbackId, cls, alt);
  return `<img class="${cls}" src="${ph.src}" ${ph.srcset?`srcset="${ph.srcset}" sizes="(max-width:760px) 100vw, 480px"`:""}
    width="${ph.w}" height="${ph.h}" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async" alt="${esc(alt)}">`;
}
function mesh(){

/* ------------------------------ analytics -------------------------------- */
const WEIGHTS = {skills:0.60, field:0.25, interests:0.15};
function matchScore(role){
  const p = state.profile;
  const cov = role.skills.reduce((a,s)=> a + lvl(s.id), 0) / (role.skills.length*100);
  let field = role.field===p.field ? 1 : (p.direction==="transition" ? 0.55 : 0.35);
  const tags = role.tags||[];
  const hit = tags.filter(x=>p.interests.includes(x)).length;
  const inter = tags.length ? Math.min(1, hit/Math.min(2,tags.length)) : 0.5;
  return Math.round((cov*WEIGHTS.skills + field*WEIGHTS.field + inter*WEIGHTS.interests)*100);
}
function gapOf(role){
  const g={have:[],dev:[],prio:[]};
  (role?role.skills:[]).forEach(s=>{
    const v = lvl(s.id);
    if(v>=75) g.have.push(s);
    else { g.dev.push(s); if(s.core && v<50) g.prio.push(s); }
  });
  return g;
}
function cvChecks(){
  const p=state.profile, role=roleById(p.role);
  const named = role? role.skills.filter(s=>lvl(s.id)>=50) : [];
  return [
    {id:"role", ok:!!p.role, ar:"دور وظيفي واحد في العنوان", en:"A single target role in the headline"},
    {id:"skills", ok:named.length>=3, ar:"ثلاث مهارات فأكثر مكتوبة بأسمائها", en:"Three or more named skills"},
    {id:"summary", ok:(p.summary||"").length>40, ar:"نبذة من سطرين إلى ثلاثة", en:"A two-to-three line summary"},
    {id:"edu", ok:!!p.major && !!p.year, ar:"التعليم كاملًا: التخصص وسنة التخرج", en:"Education: major and graduation year"},
    {id:"exp", ok:p.exp!=="none"||p.coop, ar:"خبرة أو تدريب مذكور", en:"Experience or training listed"},
    {id:"proj", ok:state.projects.length>0, ar:"مشروع واحد على الأقل بنتيجة واضحة", en:"At least one project with a clear result"}
  ];
}
const cvScore = ()=> Math.round(cvChecks().filter(c=>c.ok).length / cvChecks().length * 100);
function liChecks(){
  const p=state.profile, role=roleById(p.role), named = role? role.skills.filter(s=>lvl(s.id)>=50):[];
  return [
    {id:"headline", ok:!!p.role, key:"headline"},
    {id:"about", ok:(p.summary||"").length>40, key:"about"},
    {id:"skills", ok:named.length>=3, key:"skills"},
    {id:"exp", ok:p.exp!=="none"||p.coop, key:"exp"}
  ];
}
const liScore = ()=> Math.round(liChecks().filter(c=>c.ok).length/4*100);
const pfScore = ()=> Math.min(100, state.projects.length*40 + (state.projects.some(x=>x.link)?20:0));
const readiness = ()=> Math.round(cvScore()*0.45 + liScore()*0.3 + pfScore()*0.25);
const planProgress = ()=> state.plan.length ? Math.round(state.plan.filter(i=>i.status==="done").length/state.plan.length*100) : 0;
function bestPaths(){ return ROLES.map(r=>({role:r, m:matchScore(r)})).sort((a,b)=>b.m-a.m); }
function whyPath(role){
  const p=state.profile, g=gapOf(role), out=[];
  const ar = state.locale==="ar";
  if(role.field===p.field) out.push(ar?"مناسب لتخصصك الأكاديمي":"Fits your academic field");
  else if(p.direction==="transition") out.push(ar?"يتوافق مع رغبتك في الانتقال لمجال آخر":"Matches your wish to move fields");
  if(g.have.length) out.push(ar?`يتوافق مع ${nf(g.have.length)} من مهاراتك الحالية`:`Matches ${nf(g.have.length)} of your current skills`);
  const hit=(role.tags||[]).filter(x=>p.interests.includes(x)).length;
  if(hit) out.push(ar?"يتقاطع مع اهتماماتك المسجّلة":"Overlaps with your recorded interests");
  out.push(ar?"دور عام مطلوب في أكثر من قطاع":"A general role used across several sectors");
  return out;
}
function aiTip(){
  const p=state.profile, role=roleById(p.role); if(!role) return null;
  const g=gapOf(role);
  if(g.prio.length) return {icon:"i-target", body:`${t("ai.gapLead")} ${nm(g.prio[0])} ${t("ai.gapTail")}`, route:"skills"};
  if(g.dev.length) return {icon:"i-skills", body:`${t("ai.gapLead")} ${nm(g.dev[0])} ${t("ai.gapTail")}`, route:"skills"};
  if(cvScore()<80) return {icon:"i-doc", body:`${t("ai.cvLead")}: ${state.locale==="ar"?cvChecks().find(c=>!c.ok).ar:cvChecks().find(c=>!c.ok).en}`, route:"cv"};

  if(liScore()<75) return {icon:"i-link", body:`${t("ai.liLead")}: ${t("li."+liChecks().find(c=>!c.ok).key)}`, route:"linkedin"};
  return {icon:"i-check", body:`${t("ai.applyLead")} — ${t("ai.applyBody")}`, route:"opps"};

function buildPlan(){
  const p=state.profile, role=roleById(p.role); if(!role) return;
  const g=gapOf(role);
  const targets = (state.picks.skills.length ? role.skills.filter(s=>state.picks.skills.includes(s.id))
                  : [...g.prio, ...g.dev].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4);
  const items=[]; let w=0;
  const add=(phase,ar,en,weeks,mins,prio,dep,url)=>{ w+=weeks;
    items.push({id:"m"+items.length, phase, ar, en, mins, prio, due:addDays(today(), w*7), dep:dep||null, status:"not_started", url:url||null}); };
  const foundation = targets.slice(0,1), technical = targets.slice(1);
  if(!p.presence.cv) add(1,"جهّز مسودة سيرة بعمود واحد","Draft a single-column CV",1,45,"high");
  foundation.forEach(s=> add(1,`أساسيات ${s.ar}`,`Fundamentals of ${s.en}`,2,45,"high"));
  if(!foundation.length) add(1,"راجع أساسيات مجالك","Review your field fundamentals",1,30,"med");
  technical.forEach(s=>{ add(2,`تعلّم ${s.ar}`,`Learn ${s.en}`,2,45,"high");
    add(2,`طبّق ${s.ar} على بيانات حقيقية`,`Apply ${s.en} to real data`,1,60,"med", items[items.length-1].id); });
  state.picks.orgs.forEach(id=>{ const o=ENTITIES.find(e=>e.id===id); if(o) add(2,`تحقّق من برامج ${o.nameAr} في موقعها الرسمي`,`Check ${o.nameEn} programmes on its official site`,1,20,"low"); });
  add(3,"ابنِ مشروعًا واحدًا يثبت مهاراتك","Build one project that proves your skills",2,120,"high");
  add(3,"أضف المشروع إلى معرض أعمالك","Add the project to your portfolio",1,30,"med", items[items.length-1].id);
  if(!p.presence.li) add(4,"أكمل ملف لينكدإن","Complete your LinkedIn profile",1,25,"med");
  add(4,"حدّث سيرتك بالمهارات الجديدة","Update your CV with the new skills",1,30,"high");
  add(4,"أرسل خمس رسائل تواصل مهني","Send five outreach messages",1,40,"med");
  add(4,"استعرض برامج الخريجين والتدريب التعاوني في عَتَبة","Browse graduate and co-op programmes on Atabah",1,25,"high",null,ATABAH.browseUrl);
  add(4,"قدّم على عشر وظائف أو برامج مطابقة","Apply to ten matching roles or programmes",2,90,"high");
  state.plan = items; save();
}

function authSubmit(){
  const errEl = document.getElementById("auth-err");
  const emailEl = document.getElementById("auth-email");
  const pwdEl = document.getElementById("auth-pwd");
  const nameEl = document.getElementById("auth-name");

  const email = emailEl ? emailEl.value.trim() : "";
  const pwd = pwdEl ? pwdEl.value : "";
  const name = nameEl ? nameEl.value.trim() : "";

  if(authMode === "signup" && !name){
    if(errEl) errEl.textContent = t("auth.errName");
    if(nameEl) nameEl.focus();
    return;
  }
  if(!email || !/^\S+@\S+\.\S+$/.test(email)){
    if(errEl) errEl.textContent = t("auth.errEmail");
    if(emailEl) emailEl.focus();
    return;
  }
  if(!pwd || pwd.length < 4){
    if(errEl) errEl.textContent = t("auth.errPwd");
    if(pwdEl) pwdEl.focus();
    return;
  }

  if(errEl) errEl.textContent = "";

  state.authed = true;
  try{ sessionStorage.setItem("masari.authed", "true"); }catch(e){}

  if(authMode === "signup" && name){
    state.profile.name = name;
  }
  if(email){
    state.profile.email = email;
  }

  save();
  render();
}
function goTo(route){

    if(state.route && routeHistory[routeHistory.length-1] !== state.route){
      routeHistory.push(state.route);
      if(routeHistory.length > 30) routeHistory.shift();
    }
    try{ history.pushState({route}, ""); }catch(e){}
    state.route = route;
  }
  moreOpen = false; sheetOpen = false;
  save(); render(); window.scrollTo(0,0);
}
window.addEventListener("popstate", ev=>{

/* ------------------- strengths / weaknesses (rule-based) ------------------ */
function swot(){
  const p=state.profile, role=roleById(p.role);
  const g = role? gapOf(role) : {have:[],dev:[],prio:[]};
  const cov = role? Math.round(role.skills.reduce((a,s)=>a+lvl(s.id),0)/(role.skills.length*100)*100) : 0;
  const ar = state.locale==="ar", S=[], W=[];
  const push=(arr,icon,tAr,tEn,wAr,wEn,route)=> arr.push({icon, t:ar?tAr:tEn, why:ar?wAr:wEn, route});
  const names = a => a.slice(0,3).map(x=>nm(x)).join(ar?"، ":", ");
  const fieldName = FIELDS.find(f=>f.id===p.field);

  if(g.have.length>=2) push(S,"i-skills","أساس مهاري متين","A solid skill base",
    `${nf(g.have.length)} من مهارات الدور بمستوى ٧٥٪ فأعلى: ${names(g.have)}`,
    `${nf(g.have.length)} of the role's skills are at 75% or above: ${names(g.have)}`,"skills");
  if(role && role.field===p.field) push(S,"i-target","تخصصك في صميم الدور","Your field sits inside the role",
    `${nm(role)} ضمن مجال ${fieldName?nm(fieldName):""}`, `${nm(role)} belongs to ${fieldName?nm(fieldName):""}`,"path");
  if(p.exp==="y1"||p.exp==="y2") push(S,"i-case","خبرة عملية فعلية","Real work experience",
    t("exps."+p.exp), t("exps."+p.exp),"cv");
  else if(p.coop) push(S,"i-case","تدريب تعاوني منجز","Completed co-op training",
    "التدريب التعاوني يُحسب خبرة في أغلب برامج الخريجين","Co-op counts as experience in most graduate programmes","cv");
  if((parseInt(p.courses||"0",10)||0)>=3) push(S,"i-book","تعلّم مستمر","Continuous learning",
    `${nf(p.courses)} دورات مكتملة`, `${nf(p.courses)} courses completed`,"opps");
  if(state.projects.length) push(S,"i-case","لديك عمل يُعرض","You have work to show",
    `${nf(state.projects.length)} مشروع في معرض أعمالك`, `${nf(state.projects.length)} project(s) in your portfolio`,"portfolio");
  if(cvScore()>=80) push(S,"i-doc","سيرة جاهزة لأنظمة التتبع","An ATS-ready CV", `${nf(cvScore())}/100`, `${nf(cvScore())}/100`,"cv");
  if(p.direction && p.direction!=="undecided" && p.role) push(S,"i-map","اتجاهك واضح","A clear direction",
    `${t("dirs."+p.direction)} — ${role?nm(role):""}`, `${t("dirs."+p.direction)} — ${role?nm(role):""}`,"path");
  if(planProgress()>=40) push(S,"i-check-sq","التزام بالخطة","You are keeping to the plan",
    `${pc(planProgress())} من بنود خطتك منجزة`, `${pc(planProgress())} of your plan is done`,"tasks");

  if(g.prio.length) push(W,"i-star","مهارات أساسية دون النصف","Core skills below half",
    `${names(g.prio)} — وهي أساسية لهذا الدور`, `${names(g.prio)} — core to this role`,"skills");
  else if(role && cov<50) push(W,"i-skills","تغطية مهارات الدور منخفضة","Low coverage of the role's skills",
    `${pc(cov)} فقط من متطلبات الدور`, `${pc(cov)} of the role's requirements`,"skills");
  if(p.exp==="none" && !p.coop) push(W,"i-case","لا خبرة ولا تدريب مسجّل","No experience or training recorded",
    "برامج الخريجين والتدريب التعاوني أقصر طريق لسد هذا","Graduate and co-op programmes are the shortest way to close this","opps");
  if(!state.projects.length) push(W,"i-case","معرض أعمالك فارغ","Your portfolio is empty",
    "مشروع واحد بنتيجة واضحة يعوّض كثيرًا من نقص الخبرة","One project with a clear result offsets a lot of missing experience","portfolio");
  const failed = cvChecks().filter(c=>!c.ok);
  if(cvScore()<70 && failed.length) push(W,"i-doc","سيرتك ناقصة","Your CV is incomplete",
    `${nf(cvScore())}/100 — ${failed[0].ar}`, `${nf(cvScore())}/100 — ${failed[0].en}`,"cv");
  if(liScore()<50){ const f=liChecks().find(c=>!c.ok)||{key:"headline"};
    push(W,"i-link","ملف لينكدإن غير مكتمل","LinkedIn profile incomplete",
      `${pc(liScore())} — ${t("li."+f.key)}`, `${pc(liScore())} — ${t("li."+f.key)}`,"linkedin"); }
  if(!p.direction || p.direction==="undecided") push(W,"i-map","اتجاهك غير محسوم","Your direction is undecided",
    "جرّب دورين وقارن فجوة المهارات في كل منهما قبل أن تستقر","Try two roles and compare their gaps before settling","path");
  if(!state.plan.length) push(W,"i-check-sq","لا خطة مبنية","No plan built",
    "بلا مواعيد يبقى التطوير نية","Without dates, development stays an intention","plan");
  else { const late = state.plan.filter(i=>i.status!=="done" && new Date(i.due)<today()).length;
    if(late>=3) push(W,"i-alert","بنود تجاوزت موعدها","Items past their date",
      `${nf(late)} بنود متأخرة — أعد جدولتها بدل تركها`, `${nf(late)} late items — reschedule rather than leave them`,"plan"); }
  return {S,W,cov};
}
function vAnalysis(){
  if(!roleById(state.profile.role)) return needProfile();
  const r=swot(), S=r.S, W=r.W, cov=r.cov;
  const col=(arr,key,none,tone)=>`<section class="card pad-lg">
    <div class="row spread"><h2 style="margin:0">${tone==="ok"?ic("i-check","i-lg"):ic("i-alert","i-lg")} ${t("sw."+key)}</h2>
      <span class="pill ${tone==="ok"?"ok":"warn"}">${nf(arr.length)}</span></div><div class="rule"></div>
    ${arr.length? `<div class="grid" style="gap:10px">${arr.map(x=>`<div class="task" style="align-items:flex-start">
        <span style="color:${tone==="ok"?"var(--ok)":"var(--warn)"}; margin-top:3px">${ic(x.icon)}</span>
        <div style="flex:1; min-width:0"><b>${esc(x.t)}</b><div class="cap">${esc(x.why)}</div>
        ${tone==="warn"?`<button class="btn sec sm" style="margin-top:8px" data-act="go" data-route="${x.route}">${t("sw.fix")}</button>`:""}</div>
      </div>`).join("")}</div>` : `<p class="cap">${none}</p>`}
  </section>`;
  const txt = `${t("sw.title")}\n${t("sw.strengths")}:\n` + S.map(x=>`- ${x.t}: ${x.why}`).join("\n") +
    `\n${t("sw.weaknesses")}:\n` + W.map(x=>`- ${x.t}: ${x.why}`).join("\n");
  return `
  <section class="card pad-lg">
    <div class="row spread" style="align-items:flex-start">
      <div><h1 style="margin:0">${t("sw.title")}</h1><p class="cap" style="margin:4px 0 0">${t("sw.sub")}</p></div>
      <button class="btn sec sm" data-act="copy" data-text="${esc(txt)}">${t("sw.copy")}</button>
    </div>
    <div class="rule"></div>
    <div class="grid g2">
      <div class="card tint"><div class="cap">${t("sw.strongest")}</div><b>${S.length?esc(S[0].t):"—"}</b>
        <div class="cap">${S.length?esc(S[0].why):t("sw.noS")}</div></div>
      <div class="card"><div class="cap">${t("sw.biggest")}</div><b>${W.length?esc(W[0].t):"—"}</b>
        <div class="cap">${W.length?esc(W[0].why):t("sw.noW")}</div></div>
    </div>
    <div class="barline" style="margin-top:16px"><div class="lab"><span>${t("sk.coverage")}</span><b>${pc(cov)}</b></div>${bar(cov, cov<40?"low":cov<70?"warn":null)}</div>
  </section>
  <div class="split">${col(S,"strengths",t("sw.noS"),"ok")}${col(W,"weaknesses",t("sw.noW"),"warn")}</div>
  <p class="cap">${t("sw.how")}</p>`;
}

    <div class="split wide" style="align-items:center">

        <span class="pill brand">${ic("i-spark")} ${t("path.found")}</span>

        <p class="cap" style="margin:8px 0 0">${g.have.map(s=>esc(nm(s))).join(sep())||"—"}</p></div>

        <div class="stat"><span class="num">${nf(g.dev.length)}</span></div></div><span style="color:var(--warn)">${ic("i-alert","i-lg")}</span></div>
        <p class="cap" style="margin:8px 0 0">${g.dev.map(s=>esc(nm(s))).join(sep())||"—"}</p>
        <div class="row" style="margin-top:10px"><button class="btn sec sm" data-act="go" data-route="skills">${t("sk.title")}</button>

  <section class="card pad-lg"><h2>${t("path.alts")}</h2><div class="rule"></div>

/* ------------------------------ 3. skills -------------------------------- */

  const role=roleById(state.profile.role); if(!role) return needProfile();
  const g=gapOf(role);
  const cov = Math.round(role.skills.reduce((a,s)=>a+lvl(s.id),0)/(role.skills.length*100)*100);
  return `
  <section class="card pad-lg">
    <div class="row spread"><div><h1 style="margin:0">${t("sk.title")}</h1>
      <p class="cap" style="margin:4px 0 0">${t("sk.sub")}</p></div>
      <div><div class="cap">${t("sk.coverage")}</div><div class="stat"><span class="num">${pc(cov)}</span></div></div></div>
    <div class="rule"></div>
    ${gapBridge(cov)}
    <div class="row" style="gap:14px; margin:14px 0">
      <span class="pill ok">${ic("i-check")} ${t("sk.have")} ${nf(g.have.length)}</span>
      <span class="pill">${t("sk.dev")} ${nf(g.dev.length)}</span>
      <span class="pill gold">${ic("i-star")} ${t("sk.prio")} ${nf(g.prio.length)}</span>

          ${esc(nm(s))}${s.core?` <span class="pill" style="font-size:11px">${state.locale==="ar"?"أساسية":"core"}</span>`:""}</span>
          <b>${pc(v)}</b></div>
        ${bar(v, v<40?"low":v<70?"warn":null)}
        <div class="row" style="gap:6px">${[0,25,50,75,100].map(x=>`<button class="chip" data-on="${v===x?1:0}" data-act="set-skill" data-id="${s.id}" data-v="${x}" style="padding:4px 10px; font-size:12.5px">${nf(x)}</button>`).join("")}</div>
      </div>`;

  <section class="card"><div class="row spread"><span class="cap">${t("sk.legend")}</span>

/* ------------------------------- 4. plan --------------------------------- */
function vPlan(){
  const role=roleById(state.profile.role); if(!role) return needProfile();
  const g=gapOf(role), prog=planProgress();
  const phases=[1,2,3,4];
  return `
  <section class="card pad-lg">
    <div class="row spread"><div><h1 style="margin:0">${t("plan.title")}</h1>
      <p class="cap" style="margin:4px 0 0">${esc(nm(role))}</p></div>
      <div style="min-width:160px"><div class="row spread"><span class="cap">${t("dash.planProg")}</span><b>${pc(prog)}</b></div>${bar(prog)}</div></div>
    <div class="rule"></div>
    <h4>${t("plan.picks")}</h4>
    <div class="row">${role.skills.map(s=>{
      const on=state.picks.skills.includes(s.id);
      return `<button class="chip" data-on="${on?1:0}" data-act="pick-skill" data-id="${s.id}">${esc(nm(s))} <span class="cap">${pc(lvl(s.id))}</span></button>`;
    }).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="build-plan">${state.plan.length?t("plan.rebuild"):t("plan.build")}</button>
      ${state.picks.orgs.length?`<span class="pill">${ic("i-org")} ${nf(state.picks.orgs.length)}</span>`:""}</div>
  </section>
  ${state.plan.length? `<section class="card pad-lg">
    ${milestoneTrack()}
    <div class="note" style="margin-bottom:16px">${t("plan.note")}</div>
    ${phases.map(n=>{
      const items=state.plan.filter(i=>(i.phase||1)===n); if(!items.length) return "";
      const done=items.every(i=>i.status==="done");
      return `<div class="phase" style="margin-bottom:6px">
        <div class="phase-rail"><div class="n" data-done="${done?1:0}">${done?ic("i-check"):nf(n).padStart(2,"0")}</div>
          ${n<4?'<div class="line"></div>':""}</div>
        <div style="padding-bottom:18px">
          <div class="cap">${t("plan.phase")} ${nf(n).padStart(2,"0")}</div>
          <h3 style="margin:0 0 10px">${phaseName(n)}</h3>
          <div class="grid" style="gap:9px">${items.map(taskRow).join("")}</div>
        </div></div>`;
    }).join("")}
    </section>`
   : `<section class="card"><div class="empty">${art("il-empty","art")}<p>${t("plan.empty")}</p>
      <button class="btn" data-act="build-plan">${t("plan.build")}</button></div></section>`}`;
}
function taskRow(i){
  const late = i.status!=="done" && new Date(i.due)<today();
  return `<div class="task" data-done="${i.status==="done"?1:0}">
    <button class="box" data-s="${i.status}" data-act="cycle" data-id="${i.id}" aria-label="${t("plan.status."+i.status)}">${ic("i-check")}</button>
    <div style="flex:1; min-width:0">
      <div class="tt">${esc(state.locale==="ar"?i.ar:i.en)}</div>
      <div class="row" style="gap:8px; margin-top:4px">
        ${i.mins?`<span class="cap">${ic("i-clock")} ${nf(i.mins)} ${t("ui.min")}</span>`:""}
        ${i.prio?`<span class="pill ${i.prio==="high"?"gold":""}" style="font-size:11.5px">${t("tasks.prio."+i.prio)}</span>`:""}
        <span class="cap" ${late?'style="color:var(--warn)"':""}>${late?t("plan.overdue"):t("plan.due")} ${df(i.due)}</span>
        ${i.url?`<a class="pill brand" href="${i.url}" target="_blank" rel="noopener" style="font-size:11.5px">${t("op.visit")}</a>`:""}
      </div>
    </div></div>`;
}

  });
  const sel=(id,key,val,opts)=>`<select id="${id}" data-filter="${key}">${opts.map(o=>`<option value="${o.v}" ${val===o.v?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  return `
  <section class="card pad-lg">
    <div class="row spread" style="align-items:flex-start">
      <h1 style="margin:0">${t("op.title")}</h1>
      ${photoSlot("learning", t("vis.learnAlt"), "il-learning", "art art-side")}
    </div>
    <div class="note" style="margin:12px 0">${t("op.disclaimer")}</div>
    <p class="cap">${t("op.note")}</p>
    <div class="grid g4">

      <div><label class="fl" for="ft">${t("op.type")}</label>${sel("ft","type",f.type,[{v:"all",l:t("op.all")}].concat(Object.keys(L().types).map(k=>({v:k,l:t("types."+k)}))))}</div>
      <div><label class="fl" for="fc">${t("op.cost")}</label>${sel("fc","cost",f.cost,[{v:"all",l:t("op.all")}].concat(["free","paid","unknown"].map(k=>({v:k,l:t("costs."+k)}))))}</div>
      <div><label class="fl" for="ff">${t("op.format")}</label>${sel("ff","format",f.format,[{v:"all",l:t("op.all")}].concat(["online","in_person","hybrid","unknown"].map(k=>({v:k,l:t("formats."+k)}))))}</div>
    </div>
    <div class="row" style="margin-top:12px"><span class="pill">${nf(list.length)} ${t("op.count")}</span>
      <button class="btn sec sm" data-act="reset-filters">${t("op.reset")}</button></div>
  </section>
  <section class="card pad-lg tint">
    <div class="row spread" style="align-items:flex-start">
      <div style="flex:1 1 260px">
        <span class="pill brand">${ic("i-check")} ${t("op.verified")}</span>

        <div class="row">
          <a class="btn sm" href="${ATABAH.browseUrl}" target="_blank" rel="noopener">${t("op.visit")} — ${esc(nm(ATABAH))}</a>
          <a class="btn sec sm" href="${ATABAH.sourceUrl}" target="_blank" rel="noopener">${t("op.source")}</a>
        </div>
        <p class="cap" style="margin:10px 0 0">${t("op.checked")} ${df(ATABAH.verifiedAt)}</p>
      </div>
    </div>
  </section>
  ${list.length? `<div class="grid g2">${list.map(e=>{
    const on=state.picks.orgs.includes(e.id), ok = e.status==="verified";
    return `<article class="card hov">
      <div class="row spread"><h3 style="margin:0">${esc(nm(e))}</h3>
        <span class="pill ${ok?"ok":"gold"}">${ok?ic("i-check")+" "+t("op.verified"):t("op.demo")}</span></div>
      <span class="pill" style="margin-top:8px">${t("types."+e.type)}</span>
      <div class="rule"></div>
      ${ok?`<p style="margin:0 0 8px">${esc(state.locale==="ar"?e.purposeAr:e.purposeEn)}</p>`:""}

      ${ok?"":`<div class="cap">${t("op.why")}: ${t("op.whyPending")}</div>`}
      <div class="row" style="margin-top:12px"><button class="btn ${on?"":"sec"} sm" data-act="pick-org" data-id="${e.id}">
        ${on?ic("i-check"):""} ${on?t("op.following"):t("op.follow")}</button>
        ${ok&&e.browseUrl?`<a class="btn sm" href="${e.browseUrl}" target="_blank" rel="noopener">${t("op.visit")}</a>`:""}</div>
      <p class="cap" style="margin:10px 0 0">${ok?`${t("op.checked")} ${df(e.verifiedAt)} — ${e.sourceUrl.replace("https://","")}`:t("op.pending")}</p>

    <div class="row spread"><h1 style="margin:0">${t("ob.title")}</h1>
      <span class="pill brand">${t("ob.stepOf")} ${nf(s+1)} ${t("ui.of")} ${nf(6)}</span>

    <div class="stepper" style="margin-top:14px">${[0,1,2,3,4,5].map(i=>`<i data-on="${i<=s?1:0}"></i>`).join("")}</div>
    <div class="row cap" style="gap:14px; margin-bottom:10px">${titles.map((k,i)=> i===s?`<b style="color:var(--text)">${t(k)}</b>`:`<span>${t(k)}</span>`).join("")}</div>

function selEl(id,val,opts,ph){ return `<select id="${id}" data-bind="${id}"><option value="">${ph||"—"}</option>
  ${opts.map(o=>`<option value="${o.v}" ${val===o.v?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`; }
function st1(){ const p=state.profile, y=new Date().getFullYear(), yrs=[];
  for(let i=y+1;i>=y-12;i--) yrs.push({v:String(i),l:yf(i)});
  return `<div class="grid g2">
    <div><label class="fl" for="name">${t("ob.name")}</label><input id="name" type="text" data-bind="name" value="${esc(p.name)}"></div>
    <div><label class="fl" for="uni">${t("ob.uni")}</label><input id="uni" type="text" data-bind="uni" value="${esc(p.uni)}"></div>
    <div><label class="fl" for="field">${t("ob.field")} <span class="cap">(${t("ui.req")})</span></label>${selEl("field",p.field,FIELDS.map(f=>({v:f.id,l:nm(f)})))}</div>
    <div><label class="fl" for="major">${t("ob.major")}</label><input id="major" type="text" data-bind="major" value="${esc(p.major)}"></div>
    <div><label class="fl" for="year">${t("ob.year")} <span class="cap">(${t("ui.req")})</span></label>${selEl("year",p.year,yrs)}</div>
    <div><label class="fl" for="gpa">${t("ob.gpa")}</label>
      <div class="row" style="gap:8px"><input id="gpa" type="number" step="0.01" min="0" data-bind="gpa" value="${esc(p.gpa)}" ${p.gpaSkip?"disabled":""} style="flex:1">

      <label class="check" style="margin-top:8px"><input type="checkbox" data-bind="gpaSkip" ${p.gpaSkip?"checked":""}> ${t("ob.gpaSkip")}</label></div>
  </div>`; }
function st2(){ const p=state.profile;
  return `<div class="grid g2">
    <div><label class="fl" for="exp">${t("ob.exp")}</label>${selEl("exp",p.exp,Object.keys(L().exps).map(k=>({v:k,l:t("exps."+k)})))}</div>
    <div><label class="fl" for="courses">${t("ob.courses")}</label><input id="courses" type="number" min="0" max="99" data-bind="courses" value="${esc(p.courses)}"></div>
  </div>
  <label class="check" style="margin-top:12px"><input type="checkbox" data-bind="coop" ${p.coop?"checked":""}> ${t("ob.coop")}</label>
  <div class="rule"></div><h4>${t("ob.presence")}</h4>
  <div class="grid g3">${["cv","li","pf"].map(k=>`<label class="check"><input type="checkbox" data-bind="presence.${k}" ${p.presence[k]?"checked":""}> ${t("pres."+k)}</label>`).join("")}</div>`; }
function st3(){ const p=state.profile;
  const roles=ROLES.map(r=>({v:r.id,l:nm(r)}));
  const role=roleById(p.role);
  const bank = role? role.skills : [...new Map(ROLES.filter(r=>r.field===p.field||!p.field).flatMap(r=>r.skills).map(s=>[s.id,s])).values()].slice(0,12);
  return `<div class="grid g2">

    <div><label class="fl" for="direction">${t("ob.dir")}</label>${selEl("direction",p.direction,["stay","transition","undecided"].map(k=>({v:k,l:t("dirs."+k)})))}</div>
  </div>
  <p class="cap" style="margin-top:14px">${t("ob.skillsHint")}</p>
  <div class="row">${bank.map(s=>{ const v=lvl(s.id);
    return `<button class="skill-chip" data-act="cycle-skill" data-id="${s.id}">

function st4(){ const p=state.profile;
  return `<p class="cap">${t("ob.interests")}</p>

function st6(){ const p=state.profile, role=roleById(p.role);
  const rows=[[t("ob.field"),p.field?nm(FIELDS.find(f=>f.id===p.field)):"—"],[t("ob.year"),p.year?yf(p.year):"—"],

    <h2>${t("an.title")}</h2>
    <div class="grid" style="gap:12px; margin-top:14px">
      ${steps.map((k,i)=>`<div class="row" style="gap:10px">

/* ------------------------------- overlay --------------------------------- */
function renderOverlay(){
  if(!pendingConsent){ overlay.innerHTML=""; return; }
  overlay.innerHTML = `<div class="veil"><div class="modal" role="dialog" aria-modal="true" aria-label="${t("consent.title")}">
    <h2>${t("consent.title")}</h2><p>${t("consent.body")}</p>

  const b=overlay.querySelector("[data-act='consent-yes']"); if(b) b.focus();
}
function toast(msg){ const n=document.createElement("div"); n.className="toast"; n.setAttribute("role","status");
  n.textContent=msg; document.body.appendChild(n); setTimeout(()=>n.remove(),2600); }

/* -------------------------------- events --------------------------------- */
document.addEventListener("click", ev=>{
  if(moreOpen && !ev.target.closest(".side") && !ev.target.closest(".btn-more") && !ev.target.closest(".tab-more")){
    moreOpen = false; sheetOpen = false; render();
  }
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, p=state.profile;
  switch(a){
    case "go": goTo(el.dataset.route); break;
    case "back": {
      let prev = routeHistory.pop();
      while(prev === state.route && routeHistory.length > 0){
        prev = routeHistory.pop();
      }
      state.route = prev || "home";
      try{ history.pushState({route: state.route}, ""); }catch(e){}
      moreOpen = false; sheetOpen = false;
      save(); render(); window.scrollTo(0,0);
      break;
    }
    case "toggle-more":
    case "sheet":
      moreOpen = !moreOpen; sheetOpen = moreOpen;
      render();
      break;
    case "more-close":
    case "sheet-close":
      moreOpen = false; sheetOpen = false;
      render();
      break;
    case "lang": state.locale = state.locale==="ar"?"en":"ar"; save(); render(); break;
    case "theme": state.theme = state.theme==="dark"?"light":"dark"; save(); render(); break;
    case "auth-tab": authMode = el.dataset.mode; render(); break;
    case "auth-submit": authSubmit(); break;
    case "logout": {
      try{ sessionStorage.removeItem("masari.authed"); }catch(e){}
      state.authed = false;
      save();
      render();
      break;
    }
    case "cycle-skill": { const id=el.dataset.id, v=lvl(id); p.skills[id] = v>=100?0:v+25; save(); render(); break; }
    case "set-skill": p.skills[el.dataset.id]=+el.dataset.v; save(); render(); break;
    case "interest": { const id=el.dataset.id, i=p.interests.indexOf(id);
      if(i>=0) p.interests.splice(i,1); else p.interests.push(id); save(); render(); break; }
    case "start-role": p.role=el.dataset.id; state.step=0; goTo("profile"); break;
    case "set-role": p.role=el.dataset.id; save(); render(); toast(nm(roleById(p.role))); break;
    case "pick-skill": { const id=el.dataset.id, i=state.picks.skills.indexOf(id);
      if(i>=0) state.picks.skills.splice(i,1); else state.picks.skills.push(id); save(); render(); break; }
    case "pick-org": { const id=el.dataset.id, i=state.picks.orgs.indexOf(id);
      if(i>=0) state.picks.orgs.splice(i,1); else state.picks.orgs.push(id); save(); render(); break; }
    case "build-plan": buildPlan(); goTo("plan"); break;
    case "cycle": { const it=state.plan.find(x=>x.id===el.dataset.id); if(!it) break;
      it.status = it.status==="not_started"?"in_progress":it.status==="in_progress"?"done":"not_started"; save(); render(); break; }
    case "reset-filters": state.filters={q:"",type:"all",cost:"all",format:"all"}; save(); render(); break;
    case "add-project": { const g=id=>{const n=document.getElementById(id); return n?n.value.trim():"";};
      const pj={title:g("pj-title"),problem:g("pj-problem"),approach:g("pj-approach"),result:g("pj-result"),link:g("pj-link"),skills:g("pj-skills")};
      if(pj.title||pj.problem){ state.projects.push(pj); save(); render(); } break; }
    case "rm-project": state.projects.splice(+el.dataset.i,1); save(); render(); break;
    case "improve-cv": improveCV(); break;
    case "print": window.print(); break;
    case "copy-cv": { const n=document.getElementById("cvdoc"); copy(n?n.innerText:"", el); break; }
    case "copy": copy(el.dataset.text, el); break;
    case "ob-back": if(state.step>0){ state.step--; save(); render(); } break;
    case "ob-next": obNext(); break;
    case "consent-yes": state.consent=true; pendingConsent=null; save(); advance(); break;
    case "consent-no": pendingConsent=null; renderOverlay(); break;
    case "delete": if(confirm(t("src.delConfirm"))){ const l=state.locale, th=state.theme; wipe();
      state.locale=l; state.theme=th; routeHistory=[]; goTo("sources"); toast(t("src.deleted")); } break;
  }
});
function copy(txt, el){ if(!navigator.clipboard) return;
  navigator.clipboard.writeText(txt).then(()=>{ const o=el.textContent; el.textContent=t("ui.copied"); setTimeout(()=>{el.textContent=o;},1400); }).catch(()=>{}); }
function improveCV(){
  const p=state.profile, role=roleById(p.role); if(!role) return;
  const named = role.skills.filter(s=>lvl(s.id)>=50).map(s=>nm(s));
  if(!p.headline) p.headline = `${nm(role)}${p.major?" — "+p.major:""}${named.length?" — "+named.slice(0,2).join(sep()):""}`;
  if(!(p.summary||"").length) p.summary = state.locale==="ar"
    ? `تخصص ${p.major||"—"}${p.uni?` — ${p.uni}`:""}${p.year?`، دفعة ${p.year}`:""}، أعمل على ${named.slice(0,2).join(" و")||"بناء مهاراتي الأساسية"}، وأستهدف دور ${nm(role)}.`
    : `${p.major||"—"} graduate${p.uni?` from ${p.uni}`:""}${p.year?`, class of ${p.year}`:""}, building ${named.slice(0,2).join(" and ")||"my core skills"}, targeting a ${nm(role)} role`;
  save(); render();
  toast(state.locale==="ar"?"حدّثنا العنوان والنبذة من بياناتك":"Headline and summary filled from your data");
}
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset.bind){
    const path=el.dataset.bind, val = el.type==="checkbox"?el.checked:el.value;
    if(path.startsWith("presence")) state.profile.presence[path.split(".")[1]]=val;
    else state.profile[path]=val;
    if(path==="gpaSkip"){ const g=document.getElementById("gpa"); if(g){ g.disabled=val; if(val) state.profile.gpa=""; } }
    save();
    if(state.route==="cv"){ const d=document.getElementById("cvdoc"); if(d){ const s=el.selectionStart; refreshCV(); if(el.setSelectionRange&&s!=null){} } }
  }
  if(el.dataset.filter){
    state.filters[el.dataset.filter]=el.value; save(); render();
    const again=document.querySelector(`[data-filter="${el.dataset.filter}"]`);
    if(again&&again.tagName==="INPUT"){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  }
});
function refreshCV(){ /* live preview without losing focus in the editor */
  const host=document.getElementById("cvdoc"); if(!host) return;
  const tmp=document.createElement("div"); tmp.innerHTML=vCV();
  const fresh=tmp.querySelector("#cvdoc"); if(fresh) host.innerHTML=fresh.innerHTML;
}
document.addEventListener("change", async ev=>{
  const el=ev.target; if(el.dataset.act!=="cv") return;
  const msg=document.getElementById("cvmsg"), file=el.files&&el.files[0]; if(!file) return;
  if(file.size>5*1024*1024){ if(msg) msg.textContent=t("ob.cvFail"); el.value=""; return; }
  let text="";
  try{
    const buf=await file.arrayBuffer();
    if(/\.pdf$/i.test(file.name) && window.pdfjsLib){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
      for(let i=1;i<=Math.min(doc.numPages,6);i++){ const pg=await doc.getPage(i), c=await pg.getTextContent();
        text += c.items.map(x=>x.str).join(" ")+"\n"; }
    }else if(/\.docx$/i.test(file.name) && window.mammoth){
      const r=await window.mammoth.extractRawText({arrayBuffer:buf}); text=r.value;
    }
  }catch(e){ text=""; }
  el.value="";                                  // discard the file reference
  const box=document.getElementById("cvtext");
  if(text.trim()){ state.profile.cvText=text.trim().slice(0,4000); if(box) box.value=state.profile.cvText;
    if(msg) msg.textContent=t("ob.cvRead"); save(); }
  else if(msg) msg.textContent=t("ob.cvFail");
});
function obNext(){
  const err=document.getElementById("err"), p=state.profile; let problem="";
  if(state.step===0 && !p.field) problem=t("ob.errField");
  if(state.step===0 && !problem && !p.year) problem=t("ob.errYear");
  if(state.step===2 && !p.role) problem=t("ob.errRole");
  if(problem){ if(err) err.textContent=problem; return; }
  if(err) err.textContent="";
  if(!state.consent){ pendingConsent=true; renderOverlay(); return; }
  advance();
}
function advance(){
  if(state.step<5){ state.step++; save(); render(); window.scrollTo(0,0); return; }
  analyzing=1; render();
  const tick=()=>{ analyzing++; if(analyzing<=4){ render(); setTimeout(tick,520); }
    else { analyzing=0; state.completed=true; goTo("path"); toast(t("ob.done")); } };
  setTimeout(tick,520);
}
document.addEventListener("submit", ev=>{
  if(ev.target && ev.target.classList.contains("auth-form")){
    ev.preventDefault();
    authSubmit();
  }
});
render();
